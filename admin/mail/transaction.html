<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation - Transaction | VRMIC 2026 Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --navy-950:#0a1230; --navy-900:#0e1938; --navy-850:#122043;
  --navy-border:rgba(226,187,120,.24);
  --gold:#c9974f; --gold-light:#e8c983;
  --teal-light:#6fc9b6;
  --text-1:#f3f5fb; --text-2:#b3bcd6; --text-3:#8390b3;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;color:var(--text-1);line-height:1.6;min-height:100vh;
  background:radial-gradient(1200px 700px at 85% -10%, #12234f 0%, transparent 55%),
             radial-gradient(900px 500px at -10% 10%, #0f1d42 0%, transparent 50%), var(--navy-950);
  display:flex;flex-direction:column;
}
h2{font-family:'Fraunces',serif;font-weight:500;margin:0 0 6px;}
a{color:var(--gold-light);}
.topbar{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--navy-border);flex-wrap:wrap;gap:10px;}
.brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-size:15px;color:var(--text-1);}
.brand i{color:var(--gold-light);}
.topbar-links{display:flex;align-items:center;gap:18px;font-size:13px;}
.topbar-links a{color:var(--text-3);text-decoration:none;display:flex;align-items:center;gap:6px;}
.topbar-links a:hover{color:var(--gold-light);}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 18px;}
.card{
  width:100%;max-width:460px;background:linear-gradient(180deg,var(--navy-850),var(--navy-900));
  border:1px solid var(--navy-border);border-radius:16px;padding:36px 32px;box-shadow:0 30px 70px rgba(0,0,0,.4);
}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-light);margin-bottom:6px;display:block;}
.card p.sub{color:var(--text-3);font-size:13.5px;margin-bottom:24px;}
label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin:0 0 6px;}
.field{margin-bottom:16px;}
select,input{
  width:100%;background:var(--navy-950);border:1px solid var(--navy-border);color:var(--text-1);
  border-radius:8px;padding:12px 14px;font-family:'Inter',sans-serif;font-size:14.5px;
}
select:focus,input:focus{outline:2px solid var(--gold);outline-offset:1px;}
.row2{display:grid;grid-template-columns:110px 1fr;gap:10px;}
.btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;padding:13px 20px;border-radius:8px;
  cursor:pointer;border:none;background:linear-gradient(180deg,var(--gold-light),var(--gold));color:#241a06;
  transition:transform .15s ease;margin-top:6px;
}
.btn:hover{transform:translateY(-2px);}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;}
.alert{border-radius:8px;padding:12px 14px;font-size:13.5px;margin-bottom:16px;border:1px solid transparent;display:none;}
.alert.show{display:block;}
.alert-error{background:rgba(216,105,90,.1);border-color:rgba(216,105,90,.35);color:#e8988c;}
.alert-success{background:rgba(79,169,128,.1);border-color:rgba(79,169,128,.35);color:var(--teal-light);}
.spinner{width:14px;height:14px;border:2px solid rgba(36,26,6,.3);border-top-color:#241a06;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.preview-note{font-size:12px;color:var(--text-3);margin-top:14px;text-align:center;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><i class="fa-solid fa-paper-plane"></i> VRMIC 2026 Admin · Mail</div>
  <div class="topbar-links">
    <a href="transaction.html"><i class="fa-solid fa-table-list"></i> View Report</a>
    <a href="#" id="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
  </div>
</div>

<div class="wrap">
  <div class="card">
    <span class="eyebrow">Send Invitation</span>
    <h2>Invite a participant</h2>
    <p class="sub">This sends the conference invitation email and logs it to the transaction sheet.</p>

    <div class="alert alert-error" id="send-error"></div>
    <div class="alert alert-success" id="send-success"></div>

    <form id="send-form">
      <div class="field">
        <label for="p-title">Title &amp; Name</label>
        <div class="row2">
          <select id="p-title">
            <option value="Dr.">Dr.</option>
            <option value="Prof.">Prof.</option>
            <option value="Mr.">Mr.</option>
            <option value="Mrs.">Mrs.</option>
            <option value="Ms.">Ms.</option>
            <option value="">(none)</option>
          </select>
          <input type="text" id="p-name" required placeholder="Full name">
        </div>
      </div>
      <div class="field">
        <label for="p-email">Email</label>
        <input type="email" id="p-email" required placeholder="recipient@example.com">
      </div>
      <button class="btn" type="submit" id="send-btn"><i class="fa-solid fa-paper-plane"></i> Send invitation</button>
    </form>
    <p class="preview-note">The recipient will be greeted as &ldquo;Respected <span id="preview-name">Dr. Name</span>,&rdquo;</p>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzLKHonpM2G0EymuG2xhXPfMl7z8QJw4F9qJGWPpSie66cWUjAy1k0y61WsC_e1MYYB/exec';

// ---- Admin gate ----
const adminToken = localStorage.getItem('vrmic_admin_token');
if (!adminToken) {
  window.location.href = '../../admin-login.html';
}

document.getElementById('logout-link').addEventListener('click', function(e){
  e.preventDefault();
  localStorage.removeItem('vrmic_admin_token');
  window.location.href = '../../admin-login.html';
});

async function callApi(action, payload) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action }, payload))
  });
  return res.json();
}

function showAlert(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.classList.add('show');
}
function hideAlerts() {
  document.querySelectorAll('.alert').forEach(function(el){ el.classList.remove('show'); });
}

const titleSel = document.getElementById('p-title');
const nameInput = document.getElementById('p-name');
const previewName = document.getElementById('preview-name');
function updatePreview() {
  const t = titleSel.value ? titleSel.value + ' ' : '';
  previewName.textContent = (t + (nameInput.value || 'Name')).trim();
}
titleSel.addEventListener('change', updatePreview);
nameInput.addEventListener('input', updatePreview);
updatePreview();

document.getElementById('send-form').addEventListener('submit', async function(e){
  e.preventDefault();
  hideAlerts();
  const btn = document.getElementById('send-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Sending...';

  try {
    const res = await callApi('sendInviteMail', {
      token: adminToken,
      title: titleSel.value,
      name: nameInput.value.trim(),
      email: document.getElementById('p-email').value.trim()
    });
    if (!res.ok) { showAlert('send-error', res.error || 'Could not send invitation.'); return; }
    showAlert('send-success', 'Invitation sent successfully.');
    document.getElementById('send-form').reset();
    updatePreview();
  } catch (err) {
    showAlert('send-error', 'Could not reach the server. Check your connection and try again.');
  } finally {
    btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send invitation';
  }
});
</script>
</body>
</html>
