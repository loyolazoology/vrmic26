<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mail Transaction Report | VRMIC 2026 Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --navy-950:#0a1230; --navy-900:#0e1938; --navy-850:#122043;
  --navy-border:rgba(226,187,120,.24);
  --gold:#c9974f; --gold-light:#e8c983;
  --teal:#279c85; --teal-light:#6fc9b6;
  --danger:#d8695a;
  --text-1:#f3f5fb; --text-2:#b3bcd6; --text-3:#8390b3;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;color:var(--text-1);line-height:1.6;min-height:100vh;
  background:radial-gradient(1200px 700px at 85% -10%, #12234f 0%, transparent 55%),
             radial-gradient(900px 500px at -10% 10%, #0f1d42 0%, transparent 50%), var(--navy-950);
}
h2{font-family:'Fraunces',serif;font-weight:500;margin:0 0 4px;}
a{color:var(--gold-light);}
.topbar{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--navy-border);flex-wrap:wrap;gap:10px;}
.brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-size:15px;color:var(--text-1);}
.brand i{color:var(--gold-light);}
.topbar-links{display:flex;align-items:center;gap:18px;font-size:13px;}
.topbar-links a{color:var(--text-3);text-decoration:none;display:flex;align-items:center;gap:6px;}
.topbar-links a:hover{color:var(--gold-light);}
.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 60px;}
.panel-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:18px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-light);margin-bottom:6px;display:block;}
.stats{display:flex;gap:10px;flex-wrap:wrap;}
.stat-pill{
  background:var(--navy-850);border:1px solid var(--navy-border);border-radius:999px;
  padding:8px 16px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-2);
}
.stat-pill b{color:var(--gold-light);}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.toolbar input{
  flex:1;min-width:200px;background:var(--navy-850);border:1px solid var(--navy-border);color:var(--text-1);
  border-radius:8px;padding:10px 14px;font-family:'Inter',sans-serif;font-size:14px;
}
.toolbar input:focus{outline:2px solid var(--gold);outline-offset:1px;}
.btn-refresh{
  background:transparent;border:1px solid var(--navy-border);color:var(--text-2);border-radius:8px;
  padding:10px 16px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;
}
.btn-refresh:hover{color:var(--gold-light);border-color:var(--gold);}
.table-card{
  background:linear-gradient(180deg,var(--navy-850),var(--navy-900));
  border:1px solid var(--navy-border);border-radius:14px;overflow:hidden;
}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{
  text-align:left;padding:13px 16px;font-family:'IBM Plex Mono',monospace;font-size:11px;
  letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--navy-border);
  white-space:nowrap;
}
tbody td{padding:12px 16px;border-bottom:1px solid rgba(226,187,120,.1);color:var(--text-2);vertical-align:top;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(232,201,131,.04);}
.name-cell{color:var(--text-1);font-weight:600;}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
  font-size:11.5px;font-weight:600;
}
.badge-sent{background:rgba(79,169,128,.14);color:var(--teal-light);}
.badge-failed{background:rgba(216,105,90,.14);color:#e8988c;}
.empty-state{padding:60px 20px;text-align:center;color:var(--text-3);}
.empty-state i{font-size:28px;color:var(--gold-light);margin-bottom:12px;display:block;}
.loading-state{padding:60px 20px;text-align:center;color:var(--text-3);}
.spinner-lg{width:24px;height:24px;border:3px solid rgba(232,201,131,.25);border-top-color:var(--gold-light);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}
.scroll-x{overflow-x:auto;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><i class="fa-solid fa-table-list"></i> VRMIC 2026 Admin · Mail Report</div>
  <div class="topbar-links">
    <a href="send.html"><i class="fa-solid fa-paper-plane"></i> Send Invitation</a>
    <a href="#" id="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
  </div>
</div>

<div class="wrap">
  <div class="panel-head">
    <div>
      <span class="eyebrow">Transaction Log</span>
      <h2>Invitation mail report</h2>
    </div>
    <div class="stats">
      <div class="stat-pill">Total: <b id="stat-total">0</b></div>
      <div class="stat-pill">Sent: <b id="stat-sent">0</b></div>
      <div class="stat-pill">Failed: <b id="stat-failed">0</b></div>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="search-input" placeholder="Search by name or email...">
    <button class="btn-refresh" id="refresh-btn"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
  </div>

  <div class="table-card">
    <div class="scroll-x">
      <table id="report-table" style="display:none;">
        <thead>
          <tr>
            <th>Date &amp; Time</th>
            <th>Title</th>
            <th>Name</th>
            <th>Email</th>
            <th>Status</th>
            <th>Sent By</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <div class="loading-state" id="loading-state">
      <div class="spinner-lg"></div>
      Loading transactions...
    </div>
    <div class="empty-state" id="empty-state" style="display:none;">
      <i class="fa-regular fa-inbox"></i>
      No mail transactions yet.
    </div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzLKHonpM2G0EymuG2xhXPfMl7z8QJw4F9qJGWPpSie66cWUjAy1k0y61WsC_e1MYYB/exec';

const adminToken = localStorage.getItem('vrmic_admin_token');
if (!adminToken) {
  window.location.href = '../../admin-login.html';
}

document.getElementById('logout-link').addEventListener('click', function(e){
  e.preventDefault();
  localStorage.removeItem('vrmic_admin_token');
  window.location.href = '../../admin-login.html';
});

async function callApi(action, payload) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action }, payload))
  });
  return res.json();
}

let allRows = [];

function renderRows(rows) {
  const tbody = document.getElementById('table-body');
  const table = document.getElementById('report-table');
  const empty = document.getElementById('empty-state');

  if (!rows.length) {
    table.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  table.style.display = 'table';

  tbody.innerHTML = rows.map(function(r){
    const badgeClass = r.status === 'Sent' ? 'badge-sent' : 'badge-failed';
    const icon = r.status === 'Sent' ? 'fa-check' : 'fa-xmark';
    return '<tr>' +
      '<td>' + escapeHtml(r.timestamp) + '</td>' +
      '<td>' + escapeHtml(r.title || '—') + '</td>' +
      '<td class="name-cell">' + escapeHtml(r.name) + '</td>' +
      '<td>' + escapeHtml(r.email) + '</td>' +
      '<td><span class="badge ' + badgeClass + '"><i class="fa-solid ' + icon + '"></i> ' + escapeHtml(r.status) + '</span></td>' +
      '<td>' + escapeHtml(r.sentBy || '—') + '</td>' +
      '</tr>';
  }).join('');
}

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function updateStats(rows) {
  document.getElementById('stat-total').textContent = rows.length;
  document.getElementById('stat-sent').textContent = rows.filter(r => r.status === 'Sent').length;
  document.getElementById('stat-failed').textContent = rows.filter(r => r.status === 'Failed').length;
}

async function loadTransactions() {
  document.getElementById('loading-state').style.display = 'block';
  document.getElementById('report-table').style.display = 'none';
  document.getElementById('empty-state').style.display = 'none';
  try {
    const res = await callApi('listMailTransactions', { token: adminToken });
    if (!res.ok) {
      if (res.error && res.error.toLowerCase().includes('session')) {
        localStorage.removeItem('vrmic_admin_token');
        window.location.href = '../../admin-login.html';
        return;
      }
      alert(res.error || 'Could not load transactions.');
      return;
    }
    allRows = res.rows || [];
    updateStats(allRows);
    renderRows(allRows);
  } catch (err) {
    alert('Could not reach the server. Check your connection and try again.');
  } finally {
    document.getElementById('loading-state').style.display = 'none';
  }
}

document.getElementById('refresh-btn').addEventListener('click', loadTransactions);

document.getElementById('search-input').addEventListener('input', function(e){
  const q = e.target.value.trim().toLowerCase();
  const filtered = !q ? allRows : allRows.filter(function(r){
    return (r.name || '').toLowerCase().includes(q) || (r.email || '').toLowerCase().includes(q);
  });
  renderRows(filtered);
});

loadTransactions();
</script>
</body>
</html>
