<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | VRMIC 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --navy-950:#0a1230; --navy-900:#0e1938; --navy-850:#122043; --navy-800:#152750;
  --navy-border:rgba(226,187,120,.24);
  --gold:#c9974f; --gold-light:#e8c983; --gold-dim:#9a6b28;
  --teal:#279c85; --teal-light:#6fc9b6;
  --text-1:#f3f5fb; --text-2:#b3bcd6; --text-3:#8390b3;
  --danger:#d8695a; --success:#4fa980;
  --paper:#faf8f3; --paper-card:#ffffff; --paper-border:rgba(20,30,60,.10);
  --ink-1:#151c33; --ink-2:#4b5573; --ink-3:#7c869f;
  --radius:10px; --maxw:1180px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;color:var(--ink-2);line-height:1.6;background:var(--paper);min-height:100vh;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;color:var(--ink-1);margin:0 0 6px;}
a{color:var(--gold-dim);}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px;}
.topbar{background:var(--navy-950);border-bottom:1px solid var(--navy-border);padding:16px 0;}
.topbar-inner{max-width:var(--maxw);margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-size:15px;color:#fff;}
.brand i{color:var(--gold-light);}
.logout-btn{background:transparent;border:1px solid var(--navy-border);color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.logout-btn:hover{border-color:var(--gold);}

.tabs{display:flex;gap:6px;margin:26px 0 22px;flex-wrap:wrap;border-bottom:1px solid var(--paper-border);}
.tab-btn{padding:11px 18px;border:none;background:none;font-size:13.5px;font-weight:600;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px;}
.tab-btn.active{color:var(--navy-900);border-bottom-color:var(--gold);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

.card{background:var(--paper-card);border:1px solid var(--paper-border);border-radius:14px;padding:24px;box-shadow:0 2px 10px rgba(20,30,60,.05);margin-bottom:20px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-dim);margin-bottom:8px;display:flex;align-items:center;gap:8px;}

.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:700px){.field-row{grid-template-columns:1fr;}}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:0 0 6px;}
input,select{
  width:100%;background:#fff;border:1px solid var(--paper-border);color:var(--ink-1);
  border-radius:8px;padding:11px 14px;font-family:'Inter',sans-serif;font-size:14px;margin-bottom:14px;
}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;padding:11px 20px;border-radius:8px;cursor:pointer;border:none;background:linear-gradient(180deg,var(--gold-light),var(--gold));color:#241a06;}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.btn-sm{padding:7px 13px;font-size:12px;}
.btn-accept{background:linear-gradient(180deg,#7fd6ac,var(--teal));color:#06281c;}
.btn-reject{background:linear-gradient(180deg,#ea9c8f,var(--danger));color:#3a0e08;}
.btn-outline{background:transparent;border:1px solid var(--paper-border);color:var(--ink-1);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--paper-border);vertical-align:top;}
th{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--gold-dim);white-space:nowrap;}
.table-wrap{overflow-x:auto;}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;font-family:'IBM Plex Mono',monospace;}
.badge-pending{background:rgba(201,151,79,.12);color:var(--gold-dim);}
.badge-accepted{background:rgba(79,169,128,.14);color:var(--teal);}
.badge-rejected{background:rgba(216,105,90,.12);color:var(--danger);}
.badge-none{background:rgba(20,30,60,.06);color:var(--ink-3);}
.badge-yes{background:rgba(79,169,128,.14);color:var(--teal);}
.badge-no{background:rgba(20,30,60,.06);color:var(--ink-3);}

.alert{border-radius:8px;padding:12px 14px;font-size:13.5px;margin-bottom:16px;border:1px solid transparent;display:none;}
.alert.show{display:block;}
.alert-error{background:rgba(216,105,90,.08);border-color:rgba(216,105,90,.3);color:#a8392b;}
.alert-success{background:rgba(79,169,128,.08);border-color:rgba(79,169,128,.3);color:#1f6b48;}
.spinner{width:14px;height:14px;border:2px solid rgba(36,26,6,.3);border-top-color:#241a06;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-note{color:var(--ink-3);font-size:13.5px;font-style:italic;}
.loading-screen{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--ink-3);font-size:14px;gap:10px;}

.announce-item{border-left:3px solid var(--gold);background:rgba(201,151,79,.05);border-radius:8px;padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
.announce-item h4{font-size:14px;color:var(--ink-1);margin-bottom:4px;font-family:'Fraunces',serif;font-weight:600;}
.announce-item p{font-size:13px;color:var(--ink-2);margin:0;}
.announce-item .date{font-size:10.5px;color:var(--ink-3);font-family:'IBM Plex Mono',monospace;margin-top:6px;display:block;}

.decision-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.decision-select{width:auto;margin-bottom:0;padding:7px 10px;font-size:12px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand"><i class="fa-solid fa-user-shield"></i> VRMIC 2026 Admin</div>
    <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Log out</button>
  </div>
</div>

<div id="loading" class="loading-screen"><span class="spinner" style="border-top-color:var(--gold-dim);border-color:rgba(154,107,40,.3);"></span> Loading admin dashboard...</div>

<div id="admin-app" class="wrap" style="display:none;">

  <div class="tabs">
    <button class="tab-btn active" data-tab="add" onclick="switchTab('add')"><i class="fa-solid fa-user-plus"></i> Add Participant</button>
    <button class="tab-btn" data-tab="participants" onclick="switchTab('participants')"><i class="fa-solid fa-users"></i> Participants</button>
    <button class="tab-btn" data-tab="abstracts" onclick="switchTab('abstracts')"><i class="fa-solid fa-file-word"></i> Abstract Verification</button>
    <button class="tab-btn" data-tab="announce" onclick="switchTab('announce')"><i class="fa-solid fa-bullhorn"></i> Announcements</button>
  </div>

  <!-- ADD PARTICIPANT -->
  <div class="tab-panel active" id="tab-add">
    <div class="card">
      <span class="eyebrow"><i class="fa-solid fa-user-plus"></i> Create Participant Account</span>
      <div class="alert alert-error" id="add-error"></div>
      <div class="alert alert-success" id="add-success"></div>
      <form id="add-form">
        <div class="field-row">
          <div><label for="add-name">Full Name</label><input type="text" id="add-name" required></div>
          <div><label for="add-email">Email</label><input type="email" id="add-email" required></div>
        </div>
        <div class="field-row">
          <div><label for="add-phone">Phone Number (used as initial password)</label><input type="text" id="add-phone" required></div>
          <div><label for="add-institution">Institution</label><input type="text" id="add-institution"></div>
        </div>
        <div class="field-row">
          <div>
            <label for="add-role">Role</label>
            <select id="add-role">
              <option>Student</option>
              <option>Research Scholar</option>
              <option>Faculty</option>
              <option>Industry</option>
              <option>International Delegate</option>
            </select>
          </div>
          <div>
            <label for="add-food">Food Preference</label>
            <select id="add-food">
              <option>Vegetarian</option>
              <option>Non-Vegetarian</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div><label for="add-amount">Amount Paid (₹)</label><input type="text" id="add-amount" placeholder="e.g. 2000"></div>
          <div></div>
        </div>
        <button class="btn" type="submit" id="add-btn"><i class="fa-solid fa-user-plus"></i> Create account &amp; email credentials</button>
      </form>
    </div>
  </div>

  <!-- PARTICIPANTS LIST -->
  <div class="tab-panel" id="tab-participants">
    <div class="card">
      <span class="eyebrow"><i class="fa-solid fa-users"></i> All Participants</span>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Institution</th><th>Role</th>
            <th>Food</th><th>Amount Paid</th><th>WhatsApp</th><th>Abstract Status</th>
          </tr></thead>
          <tbody id="participants-tbody"><tr><td colspan="10" class="empty-note">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ABSTRACT VERIFICATION -->
  <div class="tab-panel" id="tab-abstracts">
    <div class="card">
      <span class="eyebrow"><i class="fa-solid fa-file-word"></i> Abstract Verification</span>
      <div class="alert alert-error" id="abstracts-error"></div>
      <div class="alert alert-success" id="abstracts-success"></div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Participant</th><th>Title</th><th>Abstract</th><th>Status</th><th>Decision</th>
          </tr></thead>
          <tbody id="abstracts-tbody"><tr><td colspan="5" class="empty-note">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ANNOUNCEMENTS -->
  <div class="tab-panel" id="tab-announce">
    <div class="card">
      <span class="eyebrow"><i class="fa-solid fa-bullhorn"></i> Post a New Announcement</span>
      <div class="alert alert-error" id="announce-error"></div>
      <div class="alert alert-success" id="announce-success"></div>
      <form id="announce-form">
        <label for="announce-title">Title</label>
        <input type="text" id="announce-title" required>
        <label for="announce-message">Message</label>
        <input type="text" id="announce-message" required placeholder="Announcement text">
        <label for="announce-poster">Poster / Image URL (optional)</label>
        <input type="text" id="announce-poster" placeholder="https://... (link to an uploaded poster image, if any)">
        <button class="btn" type="submit" id="announce-btn"><i class="fa-solid fa-paper-plane"></i> Post announcement</button>
      </form>
    </div>
    <div class="card">
      <span class="eyebrow"><i class="fa-solid fa-list"></i> Posted Announcements</span>
      <div id="announce-list"><p class="empty-note">Loading...</p></div>
    </div>
  </div>

</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwAkN1CF441d8ZtOykNIiM0oV1xaOF8lWzT2xKA3QufWBd71KvnoHR1LqRfFS3IoV4d/exec';
const token = localStorage.getItem('vrmic_admin_token');
if (!token) { window.location.href = 'admin-login.html'; }

async function callApi(action, payload) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action, token: token }, payload))
  });
  return res.json();
}
function logout() {
  localStorage.removeItem('vrmic_admin_token');
  window.location.href = 'admin-login.html';
}
function showAlert(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.classList.add('show');
}
function hideAlerts(prefix) {
  document.querySelectorAll('[id^="' + prefix + '-"]').forEach(function(el){
    if (el.classList.contains('alert')) el.classList.remove('show');
  });
}
function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function badgeClassFor(status) {
  if (status === 'Accepted') return 'badge-accepted';
  if (status === 'Rejected') return 'badge-rejected';
  if (status === 'Pending Review') return 'badge-pending';
  return 'badge-none';
}

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === name); });
  document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'participants') loadParticipants();
  if (name === 'abstracts') loadAbstracts();
  if (name === 'announce') loadAnnouncements();
}

async function bootstrap() {
  // A lightweight call just to confirm the token is valid before showing the UI.
  const res = await callApi('adminListParticipants', {});
  if (!res.ok) {
    document.getElementById('loading').textContent = res.error || 'Session invalid. Redirecting to login...';
    setTimeout(logout, 1500);
    return;
  }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('admin-app').style.display = 'block';
  renderParticipants(res.participants);
}
bootstrap();

// ---------- ADD PARTICIPANT ----------
document.getElementById('add-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  hideAlerts('add');
  const btn = document.getElementById('add-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Creating...';
  try {
    const res = await callApi('adminAddParticipant', {
      name: document.getElementById('add-name').value,
      email: document.getElementById('add-email').value,
      phone: document.getElementById('add-phone').value,
      institution: document.getElementById('add-institution').value,
      role: document.getElementById('add-role').value,
      foodPreference: document.getElementById('add-food').value,
      amountPaid: document.getElementById('add-amount').value
    });
    if (!res.ok) { showAlert('add-error', res.error || 'Could not create account.'); return; }
    showAlert('add-success', 'Account created (' + res.id + '). Login credentials emailed to the participant.');
    document.getElementById('add-form').reset();
  } catch (err) {
    showAlert('add-error', 'Could not reach the server. Check your connection and try again.');
  } finally {
    btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create account &amp; email credentials';
  }
});

// ---------- PARTICIPANTS LIST ----------
function renderParticipants(list) {
  const tbody = document.getElementById('participants-tbody');
  if (!list || list.length === 0) { tbody.innerHTML = '<tr><td colspan="10" class="empty-note">No participants yet.</td></tr>'; return; }
  tbody.innerHTML = list.map(function(p){
    return '<tr>' +
      '<td>' + escapeHtml(p.id) + '</td>' +
      '<td>' + escapeHtml(p.name) + '</td>' +
      '<td>' + escapeHtml(p.email) + '</td>' +
      '<td>' + escapeHtml(p.phone) + '</td>' +
      '<td>' + escapeHtml(p.institution) + '</td>' +
      '<td>' + escapeHtml(p.role) + '</td>' +
      '<td>' + escapeHtml(p.foodPreference) + '</td>' +
      '<td>' + escapeHtml(p.amountPaid) + '</td>' +
      '<td><span class="badge ' + (p.whatsappJoined ? 'badge-yes' : 'badge-no') + '">' + (p.whatsappJoined ? 'Joined' : 'Not yet') + '</span></td>' +
      '<td><span class="badge ' + badgeClassFor(p.abstractStatus) + '">' + escapeHtml(p.abstractStatus || 'Not Submitted') + '</span></td>' +
    '</tr>';
  }).join('');
}
async function loadParticipants() {
  const res = await callApi('adminListParticipants', {});
  if (res.ok) renderParticipants(res.participants);
}

// ---------- ABSTRACT VERIFICATION ----------
async function loadAbstracts() {
  const tbody = document.getElementById('abstracts-tbody');
  tbody.innerHTML = '<tr><td colspan="5" class="empty-note">Loading...</td></tr>';
  const res = await callApi('adminListParticipants', {});
  if (!res.ok) { tbody.innerHTML = '<tr><td colspan="5" class="empty-note">Could not load.</td></tr>'; return; }
  const submitted = res.participants.filter(function(p){ return p.abstractTitle; });
  if (submitted.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="empty-note">No abstracts submitted yet.</td></tr>'; return; }
  tbody.innerHTML = submitted.map(function(p){
    const linkCell = p.abstractLink
      ? '<a href="' + p.abstractLink + '" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i> View file</a>'
      : '<span class="empty-note">No file</span>';
    const decisionCell = p.abstractStatus === 'Accepted' || p.abstractStatus === 'Rejected'
      ? '<span class="badge ' + badgeClassFor(p.abstractStatus) + '">' + p.abstractStatus + ' &check;</span>'
      : '<div class="decision-row">' +
          '<select class="decision-select" id="ptype-' + p.row + '"><option value="Oral">Oral</option><option value="Poster">Poster</option></select>' +
          '<button class="btn btn-sm btn-accept" onclick="decide(' + p.row + ',\'Accepted\')"><i class="fa-solid fa-check"></i> Accept</button>' +
          '<button class="btn btn-sm btn-reject" onclick="decide(' + p.row + ',\'Rejected\')"><i class="fa-solid fa-xmark"></i> Reject</button>' +
        '</div>';
    return '<tr>' +
      '<td>' + escapeHtml(p.name) + '<br><span class="empty-note">' + escapeHtml(p.email) + '</span></td>' +
      '<td>' + escapeHtml(p.abstractTitle) + '</td>' +
      '<td>' + linkCell + '</td>' +
      '<td><span class="badge ' + badgeClassFor(p.abstractStatus) + '">' + escapeHtml(p.abstractStatus) + '</span></td>' +
      '<td>' + decisionCell + '</td>' +
    '</tr>';
  }).join('');
}

async function decide(row, decision) {
  hideAlerts('abstracts');
  const typeSelect = document.getElementById('ptype-' + row);
  const presentationType = typeSelect ? typeSelect.value : 'Oral';
  if (!confirm('Confirm: ' + decision + ' this abstract as ' + presentationType + ' presentation? This will email the participant.')) return;
  try {
    const res = await callApi('adminVerifyAbstract', { row: row, decision: decision, presentationType: presentationType });
    if (!res.ok) { showAlert('abstracts-error', res.error || 'Could not update.'); return; }
    showAlert('abstracts-success', 'Decision recorded and email sent.');
    loadAbstracts();
  } catch (err) {
    showAlert('abstracts-error', 'Could not reach the server. Check your connection and try again.');
  }
}

// ---------- ANNOUNCEMENTS ----------
document.getElementById('announce-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  hideAlerts('announce');
  const btn = document.getElementById('announce-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Posting...';
  try {
    const res = await callApi('adminPostAnnouncement', {
      title: document.getElementById('announce-title').value,
      message: document.getElementById('announce-message').value,
      posterImageUrl: document.getElementById('announce-poster').value
    });
    if (!res.ok) { showAlert('announce-error', res.error || 'Could not post.'); return; }
    showAlert('announce-success', 'Announcement posted.');
    document.getElementById('announce-form').reset();
    loadAnnouncements();
  } catch (err) {
    showAlert('announce-error', 'Could not reach the server. Check your connection and try again.');
  } finally {
    btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Post announcement';
  }
});

async function loadAnnouncements() {
  const el = document.getElementById('announce-list');
  el.innerHTML = '<p class="empty-note">Loading...</p>';
  const res = await callApi('adminListAnnouncements', {});
  if (!res.ok) { el.innerHTML = '<p class="empty-note">Could not load.</p>'; return; }
  if (res.announcements.length === 0) { el.innerHTML = '<p class="empty-note">No announcements posted yet.</p>'; return; }
  el.innerHTML = res.announcements.slice().reverse().map(function(a){
    const date = a.createdAt ? new Date(a.createdAt).toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'}) : '';
    return '<div class="announce-item">' +
      '<div><h4>' + escapeHtml(a.title) + '</h4><p>' + escapeHtml(a.message) + '</p><span class="date">' + date + '</span></div>' +
      '<button class="btn btn-sm btn-outline" onclick="deleteAnnouncement(' + a.row + ')"><i class="fa-solid fa-trash"></i></button>' +
    '</div>';
  }).join('');
}

async function deleteAnnouncement(row) {
  if (!confirm('Delete this announcement?')) return;
  const res = await callApi('adminDeleteAnnouncement', { row: row });
  if (res.ok) loadAnnouncements();
}
</script>
</body>
</html>
